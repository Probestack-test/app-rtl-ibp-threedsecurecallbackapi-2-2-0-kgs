        protocols:
          - https
        methods:
          - POST
        paths:
          - /cards/3ds/2.2.0/challenge-results
        strip_path: false
        preserve_host: false
        https_redirect_status_code: 426
        regex_priority: 0
        path_handling: v0
        request_buffering: true
        response_buffering: true
        tags:
          - wso2-source-id:f1139088-f219-4a94-9f8e-8c81323add5f
          - migrated-by:forgeshift-wso2-migrator
          - 3ds
          - cards
          - callbacks
          - mtls
          - wso2-resource:_challenge-results
          - wso2-verb:POST

